services:
  api:
    build:
      context: .
      target: dev
    container_name: earthlink-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://earthlink:earthlink@db:5432/earthlink
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_URL=http://chromadb:8000
      - PYTHONPATH=/app/src:/app
      - RAY_memory_monitor_refresh_ms=0
      - RESTORE_AGENTS_ON_STARTUP=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - osm_data:/tmp/geofabrik
      - db_backups:/tmp/backups
    shm_size: "4gb"
    networks:
      - earthlink-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: timescale/timescaledb-ha:pg16-all
    container_name: earthlink-db
    environment:
      POSTGRES_USER: earthlink
      POSTGRES_PASSWORD: earthlink
      POSTGRES_DB: earthlink
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata
      - ./init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql
      - osm_data:/tmp/geofabrik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthlink"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - earthlink-net

  redis:
    image: redis:7-alpine
    container_name: earthlink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - earthlink-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: earthlink-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    networks:
      - earthlink-net

  ollama:
    image: ollama/ollama:latest
    container_name: earthlink-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - earthlink-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  osm_data:
  db_backups:

networks:
  earthlink-net:
    driver: bridge
