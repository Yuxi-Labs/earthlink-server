services:
  api:
    build: .
    container_name: earthlink-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://earthlink:earthlink@db:5432/earthlink
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
    networks:
      - earthlink-net

  db:
    image: postgres:16-alpine
    container_name: earthlink-db
    environment:
      POSTGRES_USER: earthlink
      POSTGRES_PASSWORD: earthlink
      POSTGRES_DB: earthlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthlink"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - earthlink-net

  redis:
    image: redis:7-alpine
    container_name: earthlink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - earthlink-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: earthlink-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - earthlink-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  earthlink-net:
    driver: bridge
